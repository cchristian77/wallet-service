version: "3.8"

services:
  # Backend Configuration
  wallet_service:
    build:
      context: "./"
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - ./env.json:/usr/src/app/env.json:ro
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - postgres_db

  # Database Configuration
  postgres_db:
    image: "postgres:14.7"
    ports:
      - "5432:5432"
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wallet
    volumes:
      - type: volume
        source: db_wallet_vol
        target: "/var/lib/postgresql/data"
        read_only: false

#  pgadmin:
#    image: "dpage/pgadmin4:latest"
#    environment:
#      - PGADMIN_DEFAULT_EMAIL=admin@domain.com
#      - PGADMIN_DEFAULT_PASSWORD=password
#    ports:
#      - "5050:80"

volumes:
  db_wallet_vol:
    name: db_wallet_vol
